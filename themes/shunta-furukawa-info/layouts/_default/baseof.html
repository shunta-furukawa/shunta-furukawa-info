<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>{{ partial "head.html" . }}</head>
<body class="avatar-site{{ if or .IsHome (eq .Type "story") }} world-page{{ else }} world-document{{ end }}">
{{ partial "world-header.html" . }}
<main id="main">{{ block "main" . }}{{ end }}</main>
{{ if not (or .IsHome (eq .Type "story")) }}<footer class="world-document-footer"><a href="/#map">← マップへ戻る</a><span>© {{ now.Year }} Shunta Furukawa</span></footer>{{ end }}
</body></html>
